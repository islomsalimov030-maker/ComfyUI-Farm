[project]
# Имя для Comfy Registry / Manager (без префикса "ComfyUI" — требование Registry).
name = "ng-farm"
description = "Next Genium Farm: оркестратор генерации кадров и видео внутри ComfyUI (очередь, ретраи, QA, бандит)"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "gspread>=6.0",
    "jinja2>=3.1",
]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/islomsalimov030-maker/ComfyUI-Farm"

[tool.comfy]
# Нужен только для публикации в registry.comfy.org; установка по git-URL работает и без него.
PublisherId = "next-genium"
DisplayName = "Next Genium Farm"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: тест требует GPU и живой ComfyUI (запускать на поде)"]
addopts = "-m 'not gpu'"
