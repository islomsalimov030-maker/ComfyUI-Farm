# 07.11 studio server (ComfyUI 0.34.6, no Fun CN): only L_R0 / L_R1 on P4, P8, M3_bed_sit x 101/202 = 12 jobs
# (L_R1 also saves the harmonisation 0.25 / 0.35 in the same job). Pod-only L_S* stay in quality_round.yaml.
size: [1344, 768]
steps: 40
cfg: 1.0
seeds: [101, 202]
timeout_s: 1200
qa:
  confidence: 0.3
  pck_distance: 0.05
  pck_min: 0.85
  face_min: 0.6
  background_ratio_min: 0.8
bf16_patch: minimax_h3_fun_controlnet_union_pruned_bf16.safetensors
models:
  base: minimax_h3_ref2va_pruned_int8_convrot.safetensors
  eros: 10Eros_Max_h3_hybrid_beta5_int8.safetensors
locations:
  - maps: /workspace/ComfyUI-next/input/plate3d
    spec: scenes_mainroom1_r4.json
    scenes: [P4_table_stand, P8_hand_face]
  - maps: /workspace/ComfyUI-next/input/plate3d_m3
    spec: scenes_mainroom3.json
    scenes: [M3_bed_sit]
recipes:
  - {name: L_R0, model: base, depth_end: 1.0, pose_strength: 0.5, clay_video: true, playblast: true, playblast_suffix: _s, steps: 25}
  - {name: L_R1, model: base, depth_end: 1.0, pose_strength: 0.5, clay_video: true, playblast: true, playblast_suffix: _s2, steps: 25, harmonize: [0.25, 0.35]}
  # 07.11b recipe of the photo = S3 comp2: L_R1 without harmonisation + SAM3 person mask in the same job
  - {name: L_C2, model: base, depth_end: 1.0, pose_strength: 0.5, clay_video: true, playblast: true, playblast_suffix: _s2, steps: 25, sam: true}
